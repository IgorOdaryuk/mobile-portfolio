name: Deploy web demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Client Hub -> site root (/mobile-portfolio/)
      - name: Build Client Hub
        working-directory: client-hub
        run: |
          npm ci
          npx expo export -p web

      # Eat2Beat -> /mobile-portfolio/eat2beat/
      - name: Build Eat2Beat
        working-directory: eat2beat
        run: |
          npm ci
          npx expo export -p web

      # Solva storefront -> /mobile-portfolio/storefront/
      - name: Build Storefront
        working-directory: storefront
        run: |
          npm ci
          npx expo export -p web

      # Assemble one site: Client Hub at root, others under their subpaths.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r client-hub/dist/* _site/
          mkdir -p _site/eat2beat
          cp -r eat2beat/dist/* _site/eat2beat/
          mkdir -p _site/storefront
          cp -r storefront/dist/* _site/storefront/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
